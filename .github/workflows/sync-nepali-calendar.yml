name: Refresh Nepali calendar from Hamro Patro

on:
  schedule:
    # 18:37 UTC = 00:22 Nepal time on the following day.
    - cron: '37 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nepali-calendar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Refresh and validate published date mappings
        run: npm run calendar:sync
      - name: Check calendar boundaries and integrations
        run: npm test
      - name: Commit validated calendar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/assets/data/nepali-calendar.js
          if git diff --cached --quiet; then
            echo "Calendar data is unchanged."
            exit 0
          fi
          # Keep the existing live site unchanged while source updates are staged.
          git commit -m "Update validated Hamro Patro calendar data [skip netlify]"
          git push
